[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rengu-flow"
version = "0.1.6"
description = "TOML-driven diffusion training: DeepSpeed, LoRA/LoKr/full finetune (SDXL, Cosmos Predict2), optional web UI."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10,<3.14"
dependencies = [
    "toml>=0.10.2",
    # Pinned to the tested CUDA 13 build: 2.12.0+cu130. DeepSpeed >= 0.19 requires torch >= 2.11
    # (it skips its compiled C++/CUDA ops otherwise); pairing 0.19 with torch 2.10 left those ops
    # unbuilt. Keep torch and deepspeed bumped together so that contract holds.
    "torch==2.12.0",
    # Base dep: data/preprocess_media.py uses torchvision.transforms for all models (not just Cosmos).
    "torchvision==0.27.0",
    "deepspeed==0.19.0",
    "diffusers>=0.25.0",
    "peft>=0.10.0",
    "safetensors>=0.4.0",
    "datasets>=2.14.0",
    "multiprocess>=0.70.0",
    "tqdm>=4.65.0",
    "Pillow>=9.0.0",
    "imageio>=2.31.0",
    "numpy>=1.24.0",
    "ninja>=1.11",
]

[project.optional-dependencies]
lycoris = ["lycoris-lora"]
cosmos_predict2 = [
    "transformers>=4.51.0",
    "accelerate>=0.30.0",
    "einops>=0.7.0",
]
optim = [
    "bitsandbytes",
    "pytorch-optimizer",
    "torch-optimi",
    "torchao",
    "optimum-quanto",
    "transformers>=4.0",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.27.0",
]
ui = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "tensorboard>=2.14.0",
    "psutil>=5.9.0",
]
# Git-backed; resolved from [tool.uv.sources] below. uv locks the commit in uv.lock, and
# `rengu update` re-resolves it to the latest commit (uv sync --upgrade-package koptim) only
# when the koptim profile is already installed.
koptim = ["koptim"]

[project.scripts]
rengu = "rengu_flow.cli:main"
rengu-flow = "rengu_flow.cli:main"
rengu-flow-ui = "rengu_flow_ui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rengu_flow*", "rengu_flow_ui*"]

[tool.setuptools.package-data]
"rengu_flow.model.cosmos_predict2" = ["assets/**/*"]

[tool.pytest.ini_options]
markers = [
    "no_ui_db: skip the autouse UI sqlite fixture (for tests that don't touch the UI store)",
]

# Tested stack (WSL2 + NVIDIA, May 2026): Python 3.13, torch 2.12.0+cu130 (CUDA 13),
# torchvision 0.27.0+cu130, deepspeed 0.19.0, transformers 5.9, diffusers 0.37 — verified
# end-to-end on an 8 GB RTX 3000 Ada (Cosmos LoRA + SDXL LoRA + SDXL full-finetune smokes).
# WSL note: do NOT set PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True — its cuMemMap path
# raises "CUDA driver error: device not ready" under WSL2/WDDM (cuDNN conv workspace). rengu_flow
# neutralizes it automatically on WSL (see rengu_flow.platform_compat.configure_cuda_allocator).
# torch/torchvision come from the PyTorch CUDA 13.0 index; CUDA Toolkit 13.x must be installed
# (provides nvcc for DeepSpeed JIT ops). See docs for native-Windows install (prebuilt wheel).
# Not `explicit`: the cu130 index must also serve torch's transitive nvidia-*-cu13 runtime
# libs (e.g. nvidia-nvshmem-cu13 / libnvshmem_host.so.3), which are not on PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# Memory-efficient Adafusion / Muon optimizers. K-Optimizers ships no release tags, so we pin an
# exact commit — that SHA *is* koptim's version here: reproducible, and it only changes when this
# `rev` is bumped (then committed to renga). Bump it to ship a newer koptim; users pick it up on
# their next `rengu update` (only if the koptim extra is already installed). Only installed when
# the `koptim` extra is selected (see rengu_flow/install/profiles.py).
koptim = { git = "https://github.com/Koronos/K-Optimizers", rev = "7865f04db750d88c73502b36bd5b8fba459fa355" }
