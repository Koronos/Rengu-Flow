[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rengu-flow"
version = "1.2.3"
description = "TOML-driven diffusion training: DeepSpeed, LoRA/LoKr/full finetune (SDXL, Cosmos Predict2), optional web UI."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10,<3.14"
dependencies = [
    "toml>=0.10.2",
    # tomlkit is TOML-1.0 compliant (the strict `toml` lib is not): the UI parses configs with it
    # so legacy mixed int/float arrays load, then re-renders homogeneously for the strict trainer.
    "tomlkit>=0.12.0",
    # Pinned to the tested CUDA 13 build: 2.12.0+cu130. DeepSpeed >= 0.19 requires torch >= 2.11
    # (it skips its compiled C++/CUDA ops otherwise); pairing 0.19 with torch 2.10 left those ops
    # unbuilt. Keep torch and deepspeed bumped together so that contract holds.
    "torch==2.12.0",
    # Base dep: data/preprocess_media.py uses torchvision.transforms for all models (not just Cosmos).
    "torchvision==0.27.0",
    # Linux/WSL only: the `deepspeed` engine (multi-GPU pipeline). Native Windows uses the
    # `accelerate` engine and never imports DeepSpeed, so it is excluded there — DeepSpeed has no
    # Windows wheels and `uv sync` would otherwise try (and fail) to build it.
    "deepspeed==0.19.0 ; sys_platform != 'win32'",
    "diffusers>=0.25.0",
    "peft>=0.10.0",
    "safetensors>=0.4.0",
    "datasets>=2.14.0",
    "multiprocess>=0.70.0",
    "tqdm>=4.65.0",
    "Pillow>=9.0.0",
    "imageio>=2.31.0",
    "numpy>=1.24.0",
    "ninja>=1.11",
    # Scientific-Python SPEC 1 lazy submodule loading: keeps package __init__ files (utils, data)
    # from eager-importing heavy submodules (e.g. pipeline -> DeepSpeed's ~17s import) until used.
    "lazy-loader>=0.4",
    # Experiment tracking (rengu_track) is core, used by the trainer: the default TensorBoard
    # backend writes event files, and the system-metrics sampler reads CPU/RAM via psutil.
    "tensorboard>=2.14.0",
    "psutil>=5.9.0",
    # torch.compile / activation_checkpointing='auto' need Triton. On Linux torch pulls it in;
    # on native Windows torch does not, so add the community Windows build. Its major.minor must
    # match the Triton that this torch expects: torch 2.12 -> Triton 3.7.x. Bump alongside torch.
    "triton-windows>=3.7,<3.8 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
lycoris = ["lycoris-lora"]
cosmos_predict2 = [
    "transformers>=4.51.0",
    "accelerate>=0.30.0",
    "einops>=0.7.0",
]
optim = [
    "bitsandbytes",
    "pytorch-optimizer",
    "torch-optimi",
    "torchao",
    "optimum-quanto",
    "transformers>=4.0",
]
# Dataset preparation (rengu prep): ONNX taggers, VLM captioners, watermark cleanup.
# Isolated from the training path — installed on demand via the `prep` profile. If a
# dep here ever conflicts with the training lock (e.g. onnxruntime-gpu vs the torch
# cu130 pin), resolve it with uv runtime isolation in the prep subprocess, not by
# downgrading.
prep = [
    # LaMa inpainting also runs on onnxruntime (Carve/LaMa-ONNX) — one inference
    # runtime for taggers, inpainting; no extra LaMa package (simple-lama-inpainting
    # pins a Pillow 9.x that doesn't build on Python 3.13).
    # Windows only: onnxruntime-gpu 1.24+ dropped cp310 wheels (1.23.2 is the last with a
    # Python 3.10 + Windows wheel) and the native-Windows runtime is on CPython 3.10. Other
    # platforms (Linux/mac, often 3.11+) are left free to take a newer build.
    "onnxruntime-gpu==1.23.2; sys_platform == 'win32'",
    "onnxruntime-gpu>=1.20; sys_platform != 'win32'",
    "huggingface-hub>=0.23",
    "transformers>=4.51.0",
    "accelerate>=0.30.0",
    "bitsandbytes",
    "ultralytics>=8.3",
]
# Windows-only CUDA 12 runtime for the ONNX prep models (tagger / LaMa). onnxruntime-gpu is built
# against CUDA 12, but rengu's torch is cu13, so on native Windows the cu12 DLLs it needs
# (cublasLt64_12, cudnn, cudart) are absent and the CUDAExecutionProvider silently falls back to
# CPU. Installed on demand only when an ONNX model actually runs on Windows (see
# rengu_flow/prep/onnx_runtime.py); Linux/WSL provides the cu12 runtime via the system CUDA /
# manylinux wheels, so the markers leave it empty there.
onnx-cuda = [
    "nvidia-cuda-runtime-cu12~=12.0; sys_platform == 'win32'",
    "nvidia-cuda-nvrtc-cu12~=12.0; sys_platform == 'win32'",
    "nvidia-cublas-cu12~=12.0; sys_platform == 'win32'",
    "nvidia-cufft-cu12~=11.0; sys_platform == 'win32'",
    "nvidia-curand-cu12~=10.0; sys_platform == 'win32'",
    "nvidia-cudnn-cu12~=9.0; sys_platform == 'win32'",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.27.0",
    # Parallel test execution. The suite is dominated by heavy per-process imports (torch/diffusers),
    # so 4 workers is the sweet spot here — more oversubscribe RAM and re-pay import startup. See addopts.
    "pytest-xdist>=3.5",
]
ui = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]
# Git-backed; resolved from [tool.uv.sources] below. uv locks the commit in uv.lock, and
# `rengu update` re-resolves it to the latest commit (uv sync --upgrade-package kaon) only
# when the kaon profile is already installed.
kaon = ["kaon"]

[project.scripts]
rengu = "rengu_flow.cli:main"
rengu-flow = "rengu_flow.cli:main"
rengu-flow-ui = "rengu_flow_ui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rengu_flow*", "rengu_flow_ui*", "rengu_track*"]

[tool.setuptools.package-data]
"rengu_flow.model.cosmos_predict2" = ["assets/**/*"]

[tool.pytest.ini_options]
# Run in parallel by default (pytest-xdist). 4 workers is the measured sweet spot: the suite is
# import-bound (torch/diffusers per worker), so more workers re-pay that startup and contend for RAM
# rather than going faster. Override for a single-test debug run with `-n0` (serial).
addopts = "-n 4"
markers = [
    "no_ui_db: skip the autouse UI sqlite fixture (for tests that don't touch the UI store)",
]

# Tested stack (WSL2 + NVIDIA, May 2026): Python 3.13, torch 2.12.0+cu130 (CUDA 13),
# torchvision 0.27.0+cu130, deepspeed 0.19.0, transformers 5.9, diffusers 0.37 — verified
# end-to-end on an 8 GB RTX 3000 Ada (Cosmos LoRA + SDXL LoRA + SDXL full-finetune smokes).
# WSL note: do NOT set PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True — its cuMemMap path
# raises "CUDA driver error: device not ready" under WSL2/WDDM (cuDNN conv workspace). rengu_flow
# neutralizes it automatically on WSL (see rengu_flow.platform_compat.configure_cuda_allocator).
# torch/torchvision come from the PyTorch CUDA 13.0 index; CUDA Toolkit 13.x must be installed
# (provides nvcc for DeepSpeed JIT ops on the deepspeed engine). Native Windows uses the
# accelerate engine (no DeepSpeed); see docs/user/windows-install.md.
# Not `explicit`: the cu130 index must also serve torch's transitive nvidia-*-cu13 runtime
# libs (e.g. nvidia-nvshmem-cu13 / libnvshmem_host.so.3), which are not on PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# Memory-efficient optimizers (Adakaon, AdaMuon, KProdigy, Lion, AdaPNM,
# AdaBelief, AdamP, ADOPT, ScheduleFree, Lookahead, SAM, MSAM, Nekaon).
# kaon 0.7.0: auto_lr primary mode = loss-driven LR range test (needs the report_loss hook below in main.py).
# K-Optimizers (the `kaon` package) ships no release tags, so we pin an
# exact commit — that SHA *is* kaon's version here: reproducible, and it only changes when this
# `rev` is bumped (then committed to renga). Bump it to ship a newer kaon; users pick it up on
# their next `rengu update` (only if the kaon extra is already installed). Only installed when
# the `kaon` extra is selected (see rengu_flow/install/profiles.py).
kaon = { git = "https://github.com/Koronos/K-Optimizers", rev = "297942b41f050bc79873d451bc34f429dcfc8c84" }
