[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rengu-flow"
version = "0.1.0"
description = "TOML-driven diffusion training: DeepSpeed, LoRA/LoKr/full finetune (SDXL, Cosmos Predict2), optional web UI."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10,<3.14"
dependencies = [
    "toml>=0.10.2",
    "torch>=2.0",
    "deepspeed>=0.12.0",
    "diffusers>=0.25.0",
    "peft>=0.10.0",
    "safetensors>=0.4.0",
    "datasets>=2.14.0",
    "multiprocess>=0.70.0",
    "tqdm>=4.65.0",
    "Pillow>=9.0.0",
    "imageio>=2.31.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
lycoris = ["lycoris-lora"]
cosmos_predict2 = [
    "transformers>=4.51.0",
    "accelerate>=0.30.0",
    "torchvision>=0.15.0",
    "einops>=0.7.0",
]
optim = [
    "bitsandbytes",
    "pytorch-optimizer",
    "torch-optimi",
    "torchao",
    "optimum-quanto",
    "transformers>=4.0",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.27.0",
]
ui = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "tensorboard>=2.14.0",
    "psutil>=5.9.0",
]

[project.scripts]
rengu = "rengu_flow.cli:main"
rengu-flow = "rengu_flow.cli:main"
rengu-flow-ui = "rengu_flow_ui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rengu_flow*", "rengu_flow_ui*"]

[tool.setuptools.package-data]
"rengu_flow.model.cosmos_predict2" = ["assets/**/*"]
