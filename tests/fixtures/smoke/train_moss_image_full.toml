# MOSS-Image full-finetune smoke (5 steps): the 5B DiT trains in bf16 with 8-bit AdamW states and
# block swap (VRAM pending measurement; far heavier than the adapter smokes). Model paths: see
# train_moss_image.toml.
#   scripts/run_model_smoke.sh moss_image_full

dataset = "tests/fixtures/smoke/dataset_cc0.toml"
output_dir = "output"
max_steps = 5
epochs = 999
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 1
pipeline_stages = 1
activation_checkpointing = true
logging_steps = 1
caching_batch_size = 1
save_every_n_epochs = 999
bench = true
blocks_to_swap = 20

[model]
type = "moss_image"
dtype = "bfloat16"

[optimizer]
type = "adamw8bit"
lr = 5e-6

[preview]
width = 1024
height = 1024
num_inference_steps = 20
seed = 42
preview_every_n_steps = 5
preview_save_png = true
prompts = ["newest, masterpiece, 1girl, solo, fennec ears, long blonde wavy hair, blue eyes, big fluffy tail, smile, forest, sunlight"]
