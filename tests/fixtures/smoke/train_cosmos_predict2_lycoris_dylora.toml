# Cosmos Predict2 LyCORIS DYLORA smoke (12 steps), smoke_cc0 fixture.
#   .venv/bin/python -m rengu_flow.config.local_env tests/fixtures/smoke/train_cosmos_predict2_lycoris_dylora.toml

dataset = "tests/fixtures/smoke/dataset_cc0_256.toml"
output_dir = "output"
max_steps = 12
epochs = 999
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 1
pipeline_stages = 1
blocks_to_swap = 26
activation_checkpointing = false
logging_steps = 1
caching_batch_size = 1
save_every_n_epochs = 999
bench = true

[model]
type = "cosmos_predict2"
dtype = "bfloat16"
cache_text_embeddings = true

[adapter]
type = "lycoris_dylora"
block_size = 4
rank = 8

[optimizer]
type = "adamw"
lr = 3.0e-5
