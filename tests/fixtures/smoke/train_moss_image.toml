# MOSS-Image LoRA smoke (10 steps) with the versioned CC0 dataset, sized for an 8 GB Ada card: fp8
# frozen base + block swap + the Qwen3.5-9B encoder streamed from host RAM while caching.
# Model paths: the three Comfy-Org bf16 files in RENGU_MOSS_IMAGE_{TRANSFORMER,VAE,TEXT_ENCODER}_PATH
# (repo-root `.env`, see `.env.example` for the links); alternatively RENGU_MOSS_IMAGE_DIFFUSERS_PATH
# (the OpenMOSS-Team/MOSS-Image-Base diffusers folder).
#   scripts/run_model_smoke.sh moss_image
# No real weights? scripts/smoke_mini.py --model moss_image runs the same pipeline on a tiny random model.

dataset = "tests/fixtures/smoke/dataset_cc0.toml"
output_dir = "output"
max_steps = 10
epochs = 999
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 1
pipeline_stages = 1
activation_checkpointing = true
logging_steps = 1
caching_batch_size = 1
save_every_n_epochs = 999
bench = true
# 8 GB: stream DiT blocks from CPU (top-level key; under [model] it would be ignored).
blocks_to_swap = 24

[model]
type = "moss_image"
dtype = "bfloat16"
transformer_fp8_matmul = true

[adapter]
type = "lora"
rank = 32

[optimizer]
type = "adamw"
lr = 1e-4

[preview]
# 512 px with block-swapped preview: a 1024 px preview without preview_blocks_to_swap fills 8 GB, spills to
# shared memory under WDDM and stalls (docs/user/training-moss-image.md).
width = 512
height = 512
preview_blocks_to_swap = 24
num_inference_steps = 20
seed = 42
preview_every_n_steps = 10
preview_save_png = true
prompts = ["newest, masterpiece, 1girl, solo, fennec ears, long blonde wavy hair, blue eyes, big fluffy tail, smile, forest, sunlight"]
