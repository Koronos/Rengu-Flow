# SDXL LoRA smoke for async_model_export POC: 20 steps, export at 10 and 20.
# Run: ./scripts/smoke_async_export_poc.sh

dataset = "tests/fixtures/smoke/dataset_cc0.toml"
output_dir = "output"
max_steps = 20
epochs = 999
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 1
pipeline_stages = 1
logging_steps = 1
caching_batch_size = 1
save_every_n_epochs = 999
save_every_n_steps = 10
async_model_export = true
activation_checkpointing = true

[model]
type = "sdxl"
dtype = "bfloat16"
cache_text_embeddings = true

[adapter]
type = "lora"
rank = 8

[optimizer]
type = "adamw"
lr = 1.0e-4
