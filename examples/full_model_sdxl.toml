# Full-model SDXL finetuning (no adapter). Trains UNet + both text encoders.
# Run: deepspeed --num_gpus=1 -m rengu_flow.main --config examples/full_model_sdxl.toml
# Saves full checkpoints (model.safetensors) to output/<run_dir>/epochN or stepN.

dataset = "examples/minimal_dataset.toml"

[model]
type = "sdxl"
dtype = "bfloat16"
checkpoint_path = "path/to/sdxl.safetensors"

[optimizer]
type = "adamw"
lr = 1.0e-4

lr_scheduler = "cosine"
[lr_scheduler_args]
lr_min = 0.0

epochs = 1
gradient_accumulation_steps = 1
micro_batch_size_per_gpu = 1
synthetic_num_batches = 50
logging_steps = 1
save_every_n_epochs = 1
output_dir = "output"
