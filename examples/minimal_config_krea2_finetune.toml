# Full DiT finetune (no [adapter] section).

output_dir = 'output'
dataset = 'examples/minimal_krea2_dataset.toml'

epochs = 1
micro_batch_size_per_gpu = 1
pipeline_stages = 1
gradient_accumulation_steps = 1
activation_checkpointing = true
save_every_n_epochs = 1
caching_batch_size = 1
# The 12B DiT needs multiple GPUs or heavy block swap for a full finetune. Single GPU:
# stream blocks from CPU and set optimizer.gradient_release = true below.
# blocks_to_swap = 24

[model]
type = 'krea2'
dtype = 'bfloat16'
# Main model | image VAE (same file as Cosmos) | text encoder (Qwen3-VL)
transformer_path = 'path/to/krea2_raw_bf16.safetensors'
vae_path = 'path/to/qwen_image_vae.safetensors'
text_encoder_path = 'path/to/qwen3vl_4b_bf16.safetensors'

[optimizer]
type = 'adamw'
lr = 1e-6
# Per-block optimizer step during backward (pairs with blocks_to_swap above).
# gradient_release = true
