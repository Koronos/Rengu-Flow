# Example: training with TensorBoard previews (SDXL LoRA).
# Run: deepspeed --num_gpus=1 -m renga_flow.main --config examples/config_with_preview.toml
#
# Requires a real checkpoint path and dataset. Previews log to the run dir; open with:
#   tensorboard --logdir output

dataset = "examples/minimal_dataset.toml"

[model]
type = "sdxl"
dtype = "bfloat16"
checkpoint_path = "path/to/sdxl.safetensors"

[adapter]
type = "lora"
rank = 16

[optimizer]
type = "adamw"
lr = 1.0e-4

epochs = 2
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 1
save_every_n_epochs = 1
output_dir = "output"

[preview]
prompts = [
  "a photo of a cat sitting on a windowsill, soft daylight",
  { name = "landscape", prompt = "mountain lake at sunset, detailed, 4k" },
]
negative_prompt = "blurry, low quality, watermark"
preview_every_n_steps = 100
num_inference_steps = 20
guidance_scale = 7.0
seed = 42
