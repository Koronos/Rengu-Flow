output_dir = 'output'
dataset = 'examples/minimal_cosmos_predict2_dataset.toml'

epochs = 1
micro_batch_size_per_gpu = 1
pipeline_stages = 1
gradient_accumulation_steps = 1
activation_checkpointing = true
save_every_n_epochs = 1
caching_batch_size = 1

[model]
type = 'cosmos_predict2'
dtype = 'bfloat16'
# Main image model | image VAE | text encoder (Qwen3)
transformer_path = 'path/to/anima-preview.safetensors'
vae_path = 'path/to/qwen_image_vae.safetensors'
llm_path = 'path/to/qwen_3_06b_base.safetensors'
llm_adapter_lr = 0

[adapter]
type = 'lokr'
rank = 6
factor = -1

[optimizer]
type = 'adamw'
lr = 3e-5
