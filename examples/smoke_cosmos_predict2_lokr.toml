# Cosmos Predict2 LoKr smoke (~30 steps), smoke_cc0 fixture.
#   .venv/bin/python -m renga_flow.config.local_env examples/smoke_cosmos_predict2_lokr.toml
#   scripts/run_model_smoke.sh cosmos_lokr   (if added) or manual deepspeed below.

dataset = "examples/smoke_cc0_dataset.toml"
output_dir = "output"
max_steps = 30
epochs = 999
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 1
pipeline_stages = 1
activation_checkpointing = true
logging_steps = 1
caching_batch_size = 1
save_every_n_epochs = 999
bench = true

[model]
type = "cosmos_predict2"
dtype = "bfloat16"
cache_text_embeddings = true

[adapter]
type = "lokr"
rank = 6
factor = -1

[optimizer]
type = "adamw"
lr = 3.0e-5
