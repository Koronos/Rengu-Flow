# Short SDXL smoke (~10 steps) with versioned CC0 dataset. Set checkpoint_path before running.
#   deepspeed --num_gpus=1 renga_flow/main.py --config examples/smoke_sdxl.toml
# Or: scripts/run_model_smoke.sh sdxl

dataset = "examples/smoke_cc0_dataset.toml"
output_dir = "output"
max_steps = 10
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 1
pipeline_stages = 1
logging_steps = 1
caching_batch_size = 1
save_every_n_epochs = 999

[model]
type = "sdxl"
dtype = "bfloat16"
# checkpoint_path = "/path/to/sdxl.safetensors"
checkpoint_path = "path/to/sdxl.safetensors"
cache_text_embeddings = true

[optimizer]
type = "adamw"
lr = 1.0e-4
