# Full-model SDXL finetuning with only UNet trained (text encoders frozen).
# Lower VRAM and often more stable than training all parameters.
# Run: deepspeed --num_gpus=1 -m renga_flow.main --config examples/full_model_sdxl_unet_only.toml

dataset = "examples/minimal_dataset.toml"

[model]
type = "sdxl"
dtype = "bfloat16"
checkpoint_path = "path/to/sdxl.safetensors"
freeze_text_encoders = true

[optimizer]
type = "adamw"
lr = 1.0e-4

lr_scheduler = "cosine"
[lr_scheduler_args]
lr_min = 0.0

epochs = 1
gradient_accumulation_steps = 1
micro_batch_size_per_gpu = 1
synthetic_num_batches = 50
logging_steps = 1
save_every_n_epochs = 1
output_dir = "output"
