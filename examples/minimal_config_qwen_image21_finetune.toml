# Full Qwen-Image 2.1 DiT finetune (no [adapter] section). The 7B DiT needs ~14 GB for its
# bf16 weights alone plus gradients and optimizer state: plan for a 48 GB+ card, or block
# swap with optimizer.gradient_release = true (deepspeed engine) on 24 GB. Not for 8 GB cards.

output_dir = 'output'
dataset = 'examples/minimal_qwen_image21_dataset.toml'

epochs = 1
micro_batch_size_per_gpu = 1
pipeline_stages = 1
gradient_accumulation_steps = 1
activation_checkpointing = true
save_every_n_epochs = 1
caching_batch_size = 1

[model]
type = 'qwen_image21'
dtype = 'bfloat16'
# ComfyUI's bf16 files (Comfy-Org/Qwen-Image-2.1; links in docs/user/training-qwen-image21.md).
transformer_path = 'path/to/qwen_image_2.1_bf16.safetensors'
vae_path = 'path/to/qwen_image_2.1_vae_bf16.safetensors'
text_encoder_path = 'path/to/qwen3vl_8b_bf16.safetensors'
# Alternative: the whole Qwen/Qwen-Image-2.1 diffusers download instead of the three files.
# diffusers_path = 'path/to/Qwen-Image-2.1'

[optimizer]
type = 'adamw'
lr = 1e-6
