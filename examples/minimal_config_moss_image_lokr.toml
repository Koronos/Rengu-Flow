# Minimal MOSS-Image LoKr training (text-to-image) on MOSS-Image-Base. Community recipe
# (KohakuMoss defaults, not official): factor 8, full matrix, LR 2e-4.
# Sized for an 8 GB card (fp8 frozen base + block swap; VRAM pending measurement).

output_dir = 'output'
dataset = 'examples/minimal_moss_image_dataset.toml'

epochs = 1
max_steps = 4000
micro_batch_size_per_gpu = 1
pipeline_stages = 1
gradient_accumulation_steps = 1
activation_checkpointing = true
save_every_n_epochs = 1
caching_batch_size = 1
warmup_steps = 100
lr_scheduler = 'cosine'
# 8 GB: stream part of the 42 DiT blocks from CPU (lower it on bigger cards).
blocks_to_swap = 24

[lr_scheduler_args]
lr_min = 2e-5

[model]
type = 'moss_image'
dtype = 'bfloat16'
# Comfy-Org/MOSS-Image bf16 files (links in docs/user/training-moss-image.md).
transformer_path = 'path/to/moss_image_base_bf16.safetensors'
vae_path = 'path/to/flux2-vae_small.safetensors'
text_encoder_path = 'path/to/qwen3.5_9b_bf16.safetensors'
# Alternative: the whole OpenMOSS-Team/MOSS-Image-Base download instead of the three files.
# diffusers_path = 'path/to/MOSS-Image-Base'
# fp8 tensorwise frozen base (sm89+); on older GPUs use transformer_4bit = true instead.
transformer_fp8_matmul = true

[adapter]
type = 'lokr'
rank = 10000   # >= the layer width: both Kronecker factors are stored whole (alpha is then unused)
factor = 8
full_matrix = true

[optimizer]
type = 'adamw'
lr = 2e-4
weight_decay = 0.01
