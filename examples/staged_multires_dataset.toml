# Staged multi-resolution dataset config.
# Trains each third of the run at a different resolution (no mixing). See
# docs/user/dataset-config.md -> "Staged multi-resolution: resolution_schedule".
#
# The schedule shrinks total steps: each resolution is only trained for the
# fraction of the run it is active, so single-stage resolutions cost ~1/3 here.
# The schedule's "100%" is your max_steps if set in the main config, otherwise
# epochs * (the schedule-weighted step count). Latents are cached for every
# resolution listed below regardless of the schedule.

resolutions = [512, 768, 1024]
frame_buckets = [1]

[resolution_schedule]
enabled = true

# First third: 512 only.
[[resolution_schedule.stage]]
resolutions = [512]
fraction = 0.33

# Second third: 768 only.
[[resolution_schedule.stage]]
resolutions = [768]
fraction = 0.33

# Last third: 1024 only.
# (To mix the final stage instead, use e.g. resolutions = [768, 1024].)
[[resolution_schedule.stage]]
resolutions = [1024]
fraction = 0.34

[[directory]]
path = "/path/to/your/images"
num_repeats = 1
